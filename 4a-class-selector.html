<!--A class selector targets elements that have a specific class attribute.-->
<!--It starts with a dot (.) in CSS.-->

<!DOCTYPE html>
<html>
<head>
    <style>
        .highlight {
            color: white;
            background-color: darkblue;
            padding: 5px;
        }
    </style>
</head>
<body>

<p class="highlight">This paragraph is highlighted using a class selector.</p>
<p>This paragraph is normal.</p>

</body>
</html>
