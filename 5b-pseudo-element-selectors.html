<!--Pseudo-Element Selectors target specific parts of an element (not the whole element).-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example: p::first-line</title>
    <style>
        p {
            font-size: 18px;
            line-height: 1.5;
            color: black;
        }

        /* 🎨 Style only the first line of each paragraph */
        p::first-line {
            color: blue;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<h2>Example of <code>p::first-line</code></h2>

<p>
    This is an example paragraph to demonstrate the use of the <code>p::first-line</code> pseudo-element.
    Only the first line of this text will appear in blue and bold. The rest of the paragraph will remain normal.
</p>

</body>
</html>
