<!--A pseudo-class targets an element in a specific state (e.g., when hovered, clicked, focused, or first-child).-->
<!--It starts with a colon (:).-->

<!DOCTYPE html>
<html>
<head>
    <style>
        a:hover {
            color: red;
            text-decoration: underline;
        }

        li:first-child {
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="#">Hover over this link</a>

<ul>
    <li>First item (bold)</li>
    <li>Second item</li>
    <li>Third item</li>
</ul>

</body>
</html>
