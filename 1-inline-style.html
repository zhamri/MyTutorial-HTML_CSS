<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Style Example</title>
</head>
<body>

<!-- Inline style applied directly inside the element -->
<h2 style="color: white; background-color: darkblue; padding: 10px;">
    Welcome to Inline CSS Example
</h2>

<p style="color: green; font-size: 18px;">
    This paragraph uses inline styles to change its color and font size.
</p>

<p style="color: red; text-align: center; font-weight: bold;">
    This text is red, centered, and bold — all done inline!
</p>

<button style="background-color: orange; color: white; border: none; padding: 10px;">
    Click Me
</button>

</body>
</html>
